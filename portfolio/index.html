<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Hayden Harms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:       #f5f0e8;
    --ink:      #2c2416;
    --sub:      #5a5048;
    --accent:   #6b5c3e;
    --muted:    #a0917a;
    --rule-lt:  #e0d8c8;
    --gold:     #b8972a;
    --green:    #3a6b4a;
    --red:      #8b3a2a;
  }

  /* ── DARK MODE ── */
  html.dark {
    --bg:      #14100a;
    --ink:     #e8dcc8;
    --sub:     #9e8e75;
    --accent:  #c0aa88;
    --muted:   #6b5c3e;
    --rule-lt: #2a2015;
    --gold:    #c8a84a;
    --green:   #5a9b6a;
    --red:     #c05040;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    overflow-x: hidden;
    transition: background 0.2s, color 0.2s;
  }

  /* ── CONTAINER & HEADER ── */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--rule-lt);
  }

  .site-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    transition: color 0.2s;
  }
  .site-title:hover {
    color: var(--gold);
  }

  .dm-toggle-btn {
    background: transparent;
    border: 1px solid var(--rule-lt);
    color: var(--accent);
    padding: 6px 12px;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .dm-toggle-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  /* ── HEADINGS & META ── */
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.1;
  }

  .subtitle {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
  }

  h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 48px;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-lt);
  }

  /* ── GAIN BANNER ── */
  .gain-banner {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 20px 24px;
    border: 1px solid var(--rule-lt);
    background: rgba(0,0,0,0.015);
    margin-bottom: 32px;
  }
  .gain-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
  }
  .gain-meta {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── PIE CHARTS SECTION ── */
  .pie-grid {
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  .pie-section-label {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 16px;
  }
  .pie-wrap {
    display: flex;
    gap: 28px;
    align-items: center;
  }
  .pie-svg {
    width: 130px;
    height: 130px;
    flex-shrink: 0;
  }
  .pie-legend {
    flex: 1;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule-lt);
  }
  .legend-item:last-child {
    border-bottom: none;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-label {
    font-family: 'Jost', sans-serif;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--ink);
  }
  .legend-sub {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    color: var(--muted);
  }
  .legend-pct {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ── HOLDINGS BREAKDOWN ── */
  .holding-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--rule-lt);
  }
  .holding-row:last-child {
    border-bottom: none;
  }
  .holding-ticker {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    min-width: 60px;
    flex-shrink: 0;
  }
  .holding-info {
    flex: 1;
    min-width: 0;
  }
  .holding-name {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    color: var(--sub);
    font-weight: 300;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .holding-bar-bg {
    height: 3px;
    background: var(--rule-lt);
    border-radius: 2px;
    overflow: hidden;
  }
  .holding-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease;
  }
  .holding-right {
    text-align: right;
    min-width: 90px;
    flex-shrink: 0;
  }
  .holding-alloc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
  }
  .holding-change {
    font-family: 'Jost', sans-serif;
    font-size: 10.5px;
    font-weight: 400;
    margin-top: 3px;
    color: var(--muted);
  }

  .up { color: var(--green); }
  .down { color: var(--red); }

  /* ── FOOTER ── */
  footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--rule-lt);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover {
    color: var(--gold);
  }
  .footer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    text-transform: none;
    letter-spacing: 0;
  }

  @media (max-width: 580px) {
    .pie-wrap {
      flex-direction: column;
      align-items: flex-start;
    }
    footer {
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- SITE HEADER -->
  <header class="site-header">
    <a href="https://haydenharms.com" class="site-title">Hayden Harms</a>
    <button class="dm-toggle-btn" onclick="toggleDark()" aria-label="Toggle dark mode">Theme ☀︎</button>
  </header>

  <main>
    <h1>Portfolio</h1>
    <p class="subtitle">Roth IRA + Individual · Combined · As of September 16, 2026</p>

    <!-- GAIN BANNER -->
    <div class="gain-banner">
      <div class="gain-value">+10.9%</div>
      <div class="gain-meta">Total portfolio gain<br>since inception (July 2025)</div>
    </div>

    <!-- PIE CHARTS BREAKDOWN -->
    <h2>Portfolio Breakdown</h2>
    <div class="pie-grid">
      <div>
        <div class="pie-section-label">Geographic Allocation</div>
        <div class="pie-wrap">
          <svg class="pie-svg" viewBox="0 0 200 200" id="pie-geo"></svg>
          <div class="pie-legend" id="legend-geo"></div>
        </div>
      </div>

      <div>
        <div class="pie-section-label">Market Cap Breakdown</div>
        <div class="pie-wrap">
          <svg class="pie-svg" viewBox="0 0 200 200" id="pie-cap"></svg>
          <div class="pie-legend" id="legend-cap"></div>
        </div>
      </div>
    </div>

    <!-- HOLDINGS BREAKDOWN -->
    <h2>Holdings Breakdown</h2>
    <div id="holdings-list"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <span class="footer-name"><a href="https://haydenharms.com">Hayden Harms</a></span>
    <span>Dallas, TX</span>
    <a href="mailto:harms.e.hayden@gmail.com">harms.e.hayden@gmail.com</a>
  </footer>

</div>

<script>
// Dark mode toggle
function toggleDark() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.classList.add('dark');
}

// Holdings data (overwritten dynamically by GitHub Actions workflow script)
var holdings = [
  { ticker: 'VT', name: 'Vanguard Total World Stock ETF', mktVal: 10316.56, sincePct: 11.7, color: '#2c2416', domPct: 0.58, intlPct: 0.42 },
  { ticker: 'VOO', name: 'Vanguard S&P 500 ETF', mktVal: 7681.24, sincePct: 15.8, color: '#b8972a', domPct: 1.0, intlPct: 0.0 },
  { ticker: 'VB', name: 'Vanguard Small-Cap ETF', mktVal: 2042.13, sincePct: 20.0, color: '#6b5c3e', domPct: 1.0, intlPct: 0.0 },
  { ticker: 'VXUS', name: 'Vanguard Total International Stock', mktVal: 1309.1, sincePct: 17.1, color: '#a0917a', domPct: 0.0, intlPct: 1.0 },
  { ticker: 'IAU', name: 'iShares Gold Trust', mktVal: 642.56, sincePct: 4.4, color: '#c0aa88', domPct: 0.0, intlPct: 0.0 },
  { ticker: 'IBIT', name: 'iShares Bitcoin Trust ETF', mktVal: 129.12, sincePct: -35.2, color: '#5a5048', domPct: 0.0, intlPct: 0.0 },
  { ticker: 'MP', name: 'MP Materials Corp.', mktVal: 342.93, sincePct: 5.0, color: '#3a6b4a', domPct: 1.0, intlPct: 0.0 },
  { ticker: 'SPCX', name: 'Space Exploration Technologies Corp.', mktVal: 301.76, sincePct: 12.4, color: '#1f3a52', domPct: 1.0, intlPct: 0.0 }
];

const portfolioTotal = holdings.reduce(function(s, h) { return s + h.mktVal; }, 0);

// Safe dynamic lookup helper
function getMktVal(tick) {
  var target = holdings.find(function(h) { return h.ticker === tick; });
  return target ? target.mktVal : 0;
}

// ── PIE CHART ──
function drawPie(svgId, legendId, segs) {
  var svg = document.getElementById(svgId);
  var legend = document.getElementById(legendId);
  if (!svg || !legend) return;
  var cx = 100, cy = 100, r = 88, ir = 50;
  var angle = -Math.PI / 2;
  var html = '';

  segs.forEach(function(seg) {
    var sweep = (seg.pct / 100) * 2 * Math.PI;
    var end = angle + sweep;
    var x1 = cx + r * Math.cos(angle);
    var y1 = cy + r * Math.sin(angle);
    var x2 = cx + r * Math.cos(end);
    var y2 = cy + r * Math.sin(end);
    var ix1 = cx + ir * Math.cos(end);
    var iy1 = cy + ir * Math.sin(end);
    var ix2 = cx + ir * Math.cos(angle);
    var iy2 = cy + ir * Math.sin(angle);
    var la = sweep > Math.PI ? 1 : 0;
    html += '<path d="M' + x1.toFixed(2) + ',' + y1.toFixed(2) +
            ' A' + r + ',' + r + ' 0 ' + la + ',1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) +
            ' L' + ix1.toFixed(2) + ',' + iy1.toFixed(2) +
            ' A' + ir + ',' + ir + ' 0 ' + la + ',0 ' + ix2.toFixed(2) + ',' + iy2.toFixed(2) +
            ' Z" fill="' + seg.color + '" opacity="0.92" stroke="var(--bg)" stroke-width="2"/>';
    angle = end;
  });

  svg.innerHTML = html;

  legend.innerHTML = segs.map(function(s) {
    return '<div class="legend-item">' +
      '<div class="legend-dot" style="background:' + s.color + '"></div>' +
      '<div style="flex:1"><div class="legend-label">' + s.label + '</div><div class="legend-sub">' + s.sub + '</div></div>' +
      '<div class="legend-pct">' + s.pct.toFixed(1) + '%</div>' +
      '</div>';
  }).join('');
}

// Geographic segments
var geoDOM  = getMktVal('VT')*0.58 + getMktVal('VOO') + getMktVal('VB') + getMktVal('MP') + getMktVal('SPCX');
var geoINTL = getMktVal('VT')*0.42 + getMktVal('VXUS');
var geoOTH  = getMktVal('IAU') + getMktVal('IBIT');
var geoSegs = [
  { label: 'Domestic',     sub: 'U.S. equities',     pct: geoDOM/portfolioTotal*100,  color: 'var(--ink)' },
  { label: 'International', sub: 'Non-U.S. equities', pct: geoINTL/portfolioTotal*100, color: 'var(--gold)' },
  { label: 'Other',         sub: 'Gold + Crypto',      pct: geoOTH/portfolioTotal*100,  color: 'var(--muted)' },
];

// Market cap segments
var vtMkt   = getMktVal('VT');
var vooMkt  = getMktVal('VOO');
var vbMkt   = getMktVal('VB');
var vxusMkt = getMktVal('VXUS');
var mpMkt   = getMktVal('MP');
var spcxMkt = getMktVal('SPCX');

var capLG = vtMkt*0.70 + vooMkt + vxusMkt*0.60;
var capMD = vtMkt*0.20 + vxusMkt*0.30 + mpMkt + spcxMkt;
var capSM = vtMkt*0.10 + vbMkt   + vxusMkt*0.10;
var capOT = getMktVal('IAU') + getMktVal('IBIT');
var capSegs = [
  { label: 'Large Cap', sub: 'VOO, VT, VXUS core', pct: capLG/portfolioTotal*100, color: 'var(--ink)' },
  { label: 'Mid Cap',   sub: 'VT, VXUS mid blend',  pct: capMD/portfolioTotal*100, color: 'var(--accent)' },
  { label: 'Small Cap', sub: 'VB, VT small blend',  pct: capSM/portfolioTotal*100, color: 'var(--gold)' },
  { label: 'Other',     sub: 'Gold + Crypto',        pct: capOT/portfolioTotal*100, color: 'var(--muted)' },
];

drawPie('pie-geo', 'legend-geo', geoSegs);
drawPie('pie-cap', 'legend-cap', capSegs);

// ── HOLDINGS LIST ──
function drawHoldings() {
  var list = document.getElementById('holdings-list');
  var maxVal = Math.max.apply(null, holdings.map(function(h) { return h.mktVal; }));
  list.innerHTML = holdings.map(function(h) {
    var alloc = (h.mktVal / portfolioTotal * 100).toFixed(1);
    var barW  = (h.mktVal / maxVal * 100).toFixed(1);
    var cls   = h.sincePct >= 0 ? 'up' : 'down';
    var str   = (h.sincePct >= 0 ? '+' : '') + Math.abs(h.sincePct).toFixed(1) + '%';
    return '<div class="holding-row">' +
      '<div class="holding-ticker">' + h.ticker + '</div>' +
      '<div class="holding-info">' +
        '<div class="holding-name">' + h.name + '</div>' +
        '<div class="holding-bar-bg"><div class="holding-bar-fill" style="width:' + barW + '%;background:' + h.color + '"></div></div>' +
      '</div>' +
      '<div class="holding-right">' +
        '<div class="holding-alloc ' + cls + '">' + str + '</div>' +
        '<div class="holding-change">' + alloc + '% of portfolio</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

drawHoldings();
</script>

</body>
</html>
